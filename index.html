<!doctype html>
<html lang="en">
  <head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Isonga Market</title>

  <!-- SEO -->
  <meta
    name="description"
    content="Isonga Market - Buy and sell products online in Rwanda."
  />

  <!-- Canonical URL -->
  <link
  rel="canonical"
  href="https://www.isongamarket.com/"
/>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/isonga_logo.png" />

  <!-- Preconnect -->
  <link
    rel="preconnect"
    href="https://api.isongamarket.com"
  />

  <!-- Open Graph -->
  <meta property="og:title" content="Isonga Market" />
  <meta
    property="og:description"
    content="Buy and sell products online in Rwanda."
  />
  <meta
  property="og:url"
  content="https://www.isongamarket.com/"
/>
  <meta property="og:type" content="website" />

  <!-- Robots -->
  <meta name="robots" content="index, follow" />

  <!-- Async script -->
  <script
    async
    src="https://widget.northeurope.cloudapp.azure.com:9004/checkout.js"
  ></script>

  <style>
    #initial-loader {
      background: #0f172a;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9999;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top: 4px solid #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loader-text {
      color: white;
      margin-top: 15px;
      font-family: sans-serif;
      font-size: 14px;
      letter-spacing: 1px;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
</head>
  <body>
    <div id="root">
      <!-- This content is automatically deleted by React once it loads -->
      <div id="initial-loader">
        <div class="spinner"></div>
        <div class="loader-text">ISONGA MARKET</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

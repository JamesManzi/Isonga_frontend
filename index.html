<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Isonga Market</title>
    
    <!-- Speed up connection to your backend -->
    <link rel="preconnect" href="https://api.isongamarket.com">
    
    <!-- Use 'async' so this doesn't block the white page -->
    <script async src="https://widget.northeurope.cloudapp.azure.com:9004/checkout.js"></script>

    <style>
      /* This CSS lives in the HTML so it works INSTANTLY */
      #initial-loader {
        background: #0f172a;
        height: 100vh;
        width: 100vw;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255,255,255,0.1);
        border-top: 4px solid #38bdf8;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .loader-text {
        color: white;
        margin-top: 15px;
        font-family: sans-serif;
        font-size: 14px;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- This content is automatically deleted by React once it loads -->
      <div id="initial-loader">
        <div class="spinner"></div>
        <div class="loader-text">ISONGA MARKET</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
